name: Rust checks and AWS deployment
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace

  package:
    name: Build Linux release binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build NodeX engine
        run: cargo build --release -p nodex-engine
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: nodex-engine-linux-x86_64
          path: target/release/nodex-engine
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, package]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: nodex-engine-linux-x86_64
          path: ./release

      - name: Configure SSH
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -euo pipefail
          test -n "$AWS_HOST" || { echo "Missing AWS_HOST secret"; exit 1; }
          test -n "$AWS_USER" || { echo "Missing AWS_USER secret"; exit 1; }
          test -n "$AWS_SSH_PRIVATE_KEY" || { echo "Missing AWS_SSH_PRIVATE_KEY secret"; exit 1; }
          install -m 700 -d ~/.ssh
          # Normalize Windows CRLF line endings before loading the key.
          printf '%s' "$AWS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Validate without displaying the private key.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::AWS_SSH_PRIVATE_KEY is invalid. Re-copy the complete private key, including BEGIN/END lines, into the production environment secret."
            exit 1
          fi
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts

      - name: Transfer release binary
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -euo pipefail
          chmod +x ./release/nodex-engine
          scp ./release/nodex-engine "$AWS_USER@$AWS_HOST:/tmp/nodex-engine-${GITHUB_SHA}"

      - name: Install, restart and verify service
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -euo pipefail
          ssh "$AWS_USER@$AWS_HOST" "GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          SERVICE="nodex.service"
          APP_DIR="/opt/nodex"
          TARGET="$APP_DIR/target/release/nodex-engine"
          NEW_BINARY="/tmp/nodex-engine-$GITHUB_SHA"
          BACKUP="$APP_DIR/target/release/nodex-engine.previous"

          test -x "$NEW_BINARY"
          sudo install -d -o nodex -g nodex "$APP_DIR/target/release"
          if sudo test -f "$TARGET"; then
            sudo cp "$TARGET" "$BACKUP"
          fi
          sudo install -o nodex -g nodex -m 0755 "$NEW_BINARY" "$TARGET"
          if ! sudo systemctl restart "$SERVICE"; then
            if sudo test -f "$BACKUP"; then
              sudo cp "$BACKUP" "$TARGET"
              sudo systemctl restart "$SERVICE" || true
            fi
            exit 1
          fi
          sleep 5
          if ! sudo systemctl is-active --quiet "$SERVICE"; then
            echo "Service failed after deployment; attempting rollback"
            if sudo test -f "$BACKUP"; then
              sudo cp "$BACKUP" "$TARGET"
              sudo systemctl restart "$SERVICE" || true
            fi
            sudo systemctl status "$SERVICE" --no-pager || true
            exit 1
          fi
          rm -f "$NEW_BINARY"
          echo "NodeX deployment succeeded: $GITHUB_SHA"
          REMOTE
